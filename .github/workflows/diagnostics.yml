name: Diagnostics
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m pytest tests -q -p no:cacheprovider
      - run: python prepare_vercel.py --check
      - run: python -m compileall -q app.py features_extract.py secure_fetch.py ai_analysis.py storage.py postgres_store.py risk_engine.py file_analysis.py reports.py threat_intelligence.py
      - run: |
          for file in static/js/*.js; do node --check "$file"; done
      - run: node --test tests/test_*.js
